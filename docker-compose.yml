version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: gemileads_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-gemileads}
      - POSTGRES_USER=${POSTGRES_USER:-gemileads_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-supersecret123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: gemileads_web
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-gemileads_user}:${POSTGRES_PASSWORD:-supersecret123}@db:5432/${POSTGRES_DB:-gemileads}
    ports:
      - "8000:8000"
    depends_on:
      - db

  worker:
    build: .
    container_name: gemileads_worker
    restart: unless-stopped
    command: python manage.py qcluster
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-gemileads_user}:${POSTGRES_PASSWORD:-supersecret123}@db:5432/${POSTGRES_DB:-gemileads}
    depends_on:
      - db
      - web

volumes:
  postgres_data:
