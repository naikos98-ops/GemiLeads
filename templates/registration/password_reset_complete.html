{% extends 'base.html' %}
{% block title %}Ολοκλήρωση · Gemi Leads{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-head">
    <h1>Επιτυχία!</h1>
  </div>
  <div class="auth-notice ok">
    Ο κωδικός σας άλλαξε με επιτυχία. Μπορείτε πλέον να συνδεθείτε με τον νέο σας κωδικό.
  </div>
  <div class="auth-actions">
    <a href="{% url 'login' %}" class="product-ink-button" style="width:100%;">Σύνδεση τώρα</a>
  </div>
</div>
{% endblock %}
