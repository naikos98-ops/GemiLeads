{% extends 'base.html' %}
{% block title %}Ολοκλήρωση · Gemi Leads{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-head">
    <p class="product-eyebrow">ΛΟΓΑΡΙΑΣΜΟΣ</p>
    <h1>Ο κωδικός άλλαξε</h1>
  </div>
  <div class="auth-notice ok">
    <b>Επιτυχία</b>
    Ο κωδικός σου άλλαξε με επιτυχία. Μπορείς πλέον να συνδεθείς με τον νέο σου κωδικό.
  </div>
  <div class="auth-actions">
    <a href="{% url 'login' %}" class="product-ink-button" style="width:100%;">ΣΥΝΔΕΣΗ</a>
  </div>
</div>
{% endblock %}
