{% extends 'base.html' %}
{% block title %}Ολοκλήρωση · Gemi Leads{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}
{% block content %}
<section class="flex min-h-screen items-center justify-center bg-sand-50 px-5 py-12">
  <div class="w-full max-w-md rounded-card border border-navy-900/10 bg-white p-8 text-center shadow-soft" data-reveal>
    <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-emerald-100 text-3xl text-emerald-600">
      ✓
    </div>
    <h1 class="text-3xl font-extrabold">Επιτυχία!</h1>
    <p class="mt-4 text-sm text-navy-700/60">
      Ο κωδικός σας άλλαξε με επιτυχία. Μπορείτε πλέον να συνδεθείτε με τον νέο σας κωδικό.
    </p>
    <a href="{% url 'login' %}" class="mt-8 inline-block rounded-full bg-blue-600 px-8 py-3.5 font-bold text-white transition hover:bg-blue-700">
      Σύνδεση τώρα
    </a>
  </div>
</section>
{% endblock %}
