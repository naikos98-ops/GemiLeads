{% extends 'base.html' %}{% block title %}Σύνδεση · Gemi Leads{% endblock %}{% block content %}<section class="grid min-h-[82vh] place-items-center px-5 py-16"><div class="w-full max-w-md" data-reveal><div class="text-center"><p class="text-sm font-bold uppercase tracking-[.2em] text-blue-600">Καλώς ήρθες ξανά</p><h1 class="mt-3 text-4xl font-extrabold">Σύνδεση</h1></div><form method="post" class="mt-8 space-y-5 rounded-[2rem] border border-navy-900/10 bg-white p-8 shadow-soft">{% csrf_token %}{% if form.errors %}<p class="rounded-xl bg-red-50 p-3 text-sm text-red-700">Τα στοιχεία σύνδεσης δεν είναι σωστά.</p>{% endif %}<div><label class="mb-2 block text-sm font-bold">Email</label><input name="username" type="email" autofocus required class="w-full rounded-2xl border border-navy-900/10 bg-sand-50 px-4 py-3 outline-none focus:border-blue-500"></div><div><div class="mb-2 flex items-center justify-between"><label class="block text-sm font-bold">Κωδικός</label><a href="{% url 'password_reset' %}" class="text-xs font-bold text-blue-600 hover:underline">Ξέχασες τον κωδικό;</a></div><input name="password" type="password" required class="w-full rounded-2xl border border-navy-900/10 bg-sand-50 px-4 py-3 outline-none focus:border-blue-500"></div><button class="w-full rounded-full bg-navy-950 px-6 py-3.5 font-bold text-white transition hover:-translate-y-1">Σύνδεση</button><p class="text-center text-sm text-navy-700/50">Δεν έχεις λογαριασμό; <a href="{% url 'signup' %}" class="font-bold text-blue-600">Εγγραφή</a></p></form></div></section>{% endblock %}
