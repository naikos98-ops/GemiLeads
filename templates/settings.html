{% extends 'base.html' %}{% block title %}Ρυθμίσεις · GEMI Signal{% endblock %}{% block content %}
<section class="min-h-[80vh] px-5 py-16"><div class="mx-auto max-w-3xl"><div data-reveal><p class="text-sm font-bold uppercase tracking-[.2em] text-blue-600">Προτιμήσεις</p><h1 class="mt-2 text-4xl font-extrabold">Το digest στα μέτρα σου.</h1><p class="mt-3 text-navy-700/55">Έλεγξε πότε και τι λαμβάνεις στο {{ user.email }}.</p></div><form method="post" class="mt-10 space-y-7 rounded-[2rem] border border-navy-900/10 bg-white p-8 shadow-soft" data-reveal>{% csrf_token %}<div><label class="mb-2 block text-sm font-bold">{{ form.frequency.label }}</label>{{ form.frequency }}</div><label class="flex cursor-pointer items-center justify-between gap-5 rounded-2xl bg-sand-50 p-5"><span><b class="block">{{ form.only_active.label }}</b><span class="text-sm text-navy-700/50">Απόκρυψη ανενεργών ή κλεισμένων εγγραφών.</span></span>{{ form.only_active }}</label><label class="flex cursor-pointer items-center justify-between gap-5 rounded-2xl bg-sand-50 p-5"><span><b class="block">{{ form.include_empty_digest.label }}</b><span class="text-sm text-navy-700/50">Μικρό μήνυμα επιβεβαίωσης όταν η ημέρα δεν έχει αποτελέσματα.</span></span>{{ form.include_empty_digest }}</label><button class="rounded-full bg-navy-950 px-7 py-3.5 font-bold text-white transition hover:-translate-y-1">Αποθήκευση αλλαγών</button></form></div></section>
{% endblock %}
