{% extends 'base.html' %}
{% block title %}Συμβουλές και υπενθυμίσεις · Gemi Leads{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-head">
    <h1>Να συνεχίσω να σου γράφω;</h1>
    <p>Πάτα για να συνεχίσεις να λαμβάνεις συμβουλές και υπενθυμίσεις.</p>
  </div>
  <form method="post" class="auth-form">
    {% csrf_token %}
    <div class="auth-actions">
      <button type="submit" class="product-ink-button">Ναι, κράτα με</button>
    </div>
  </form>
</div>
{% endblock %}
