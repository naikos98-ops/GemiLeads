{% for kind, value in blocks %}{% if kind == "p" %}<p style="margin: 0 0 16px; font-size: 15px; line-height: 23px; color: #12201e;">{{ value }}</p>{% elif kind == "list" %}<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 0 0 16px;">{% for item in value %}<tr><td valign="top" style="padding: 0 10px 8px 0; font-size: 15px; line-height: 23px; color: #775215;">—</td><td style="padding: 0 0 8px; font-size: 15px; line-height: 23px; color: #12201e;">{{ item }}</td></tr>{% endfor %}</table>{% elif kind == "steps" %}<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 0 0 16px;">{% for item in value %}<tr><td valign="top" style="padding: 0 10px 8px 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; line-height: 23px; font-weight: 700; color: #775215;">{{ forloop.counter }}.</td><td style="padding: 0 0 8px; font-size: 15px; line-height: 23px; color: #12201e;">{{ item }}</td></tr>{% endfor %}</table>{% elif kind == "notice" %}<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin: 0 0 16px;"><tr><td style="padding: 12px 16px; border: 1px solid #12201e; border-left: 3px solid #e6a029; font-size: 13px; line-height: 19px; color: #12201e;">{{ value }}</td></tr></table>{% endif %}{% endfor %}
