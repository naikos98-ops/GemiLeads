services:
  - type: web
    name: gemileads_web
    runtime: python
    buildCommand: "./scripts/build_render.sh"
    preDeployCommand: "python manage.py migrate"
    startCommand: "honcho start"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: gemileads.gr,gemileads-web.onrender.com
      - key: BASE_URL
        value: https://gemileads.gr
      - key: GEMI_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: DEFAULT_FROM_EMAIL
        value: Gemi Leads <notifications@gemileads.gr>
