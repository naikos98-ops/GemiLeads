services:
  - type: web
    name: gemileads_web
    runtime: python
    # Co-located with the Supabase database (Frankfurt / eu-central-1). Running from Oregon
    # meant every SQL query crossed the Atlantic (~160ms round-trip); a page doing ~12 queries
    # took multiple seconds regardless of how small the database is. Also closer to the users
    # (Greek businesses). Render cannot move an existing service's region -- this needs a new
    # service in frankfurt, then repoint the gemileads.gr DNS to it and delete the old one.
    region: frankfurt
    buildCommand: "./scripts/build_render.sh"
    preDeployCommand: "python manage.py migrate"
    startCommand: "honcho start"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: gemileads.gr,www.gemileads.gr,gemileads-web.onrender.com
      - key: BASE_URL
        value: https://gemileads.gr
      - key: GEMI_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: DEFAULT_FROM_EMAIL
        value: Gemi Leads <notifications@send.gemileads.gr>
      - key: EMAIL_REPLY_TO
        value: info@gemileads.gr
      - key: BREVO_WEBHOOK_TOKEN
        sync: false
      - key: OUTREACH_DAILY_SEND_CAP
        value: "250"
      - key: LEGAL_CONTROLLER_NAME
        sync: false
      - key: LEGAL_VAT
        sync: false
      - key: LEGAL_GEMI
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: LEGAL_CONTACT_EMAIL
        sync: false
      - key: SUPERADMIN_EMAILS
        value: info@gemileads.gr,naikos98@gmail.com,iotellis@taxville.gr
      # Billing went live 2026-08-26 -- real Stripe subscriptions, real charges.
      - key: LEGAL_BILLING_ACTIVE
        value: "1"
      - key: BETA_MODE
        value: "0"
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
