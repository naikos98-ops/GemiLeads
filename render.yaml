services:
  - type: web
    name: gemileads_web
    runtime: python
    buildCommand: "./scripts/build_render.sh"
    preDeployCommand: "python manage.py migrate"
    startCommand: "honcho start"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: gemileads.gr,www.gemileads.gr,gemileads-web.onrender.com
      - key: BASE_URL
        value: https://gemileads.gr
      - key: GEMI_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: DEFAULT_FROM_EMAIL
        value: Gemi Leads <notifications@send.gemileads.gr>
      - key: EMAIL_REPLY_TO
        value: info@gemileads.gr
      - key: LEGAL_CONTROLLER_NAME
        sync: false
      - key: LEGAL_VAT
        sync: false
      - key: LEGAL_GEMI
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: LEGAL_CONTACT_EMAIL
        sync: false
      - key: LEGAL_BILLING_ACTIVE
        value: "0"
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
